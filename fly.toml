app = "ethos"
primary_region = "iad"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  # The canonical domain: this feeds every canonical tag, OG URL and sitemap
  # <loc>. Pointing it at the fly.dev hostname would have Google index that
  # instead of the domain verified in Search Console, and would make the
  # sitemap cross-domain. LiveView still works on ethos.fly.dev — runtime.exs
  # keeps it in check_origin.
  PHX_HOST = "ethosguides.com"
  PORT = "8080"
  # Fly's internal .flycast Postgres address is IPv6-only.
  ECTO_IPV6 = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
